route:
  group_by: ["alertname"]
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: "default-webhook"

receivers:
  - name: "default-webhook"
    webhook_configs:
      - url: "http://host.docker.internal:5000/hook"  # change to your webhook intake
        send_resolved: true

# To send elsewhere, replace the receiver with e.g.:
#   - name: "default-webhook"
#     slack_configs:
#       - api_url: "https://hooks.slack.com/services/XXXX/YYYY/ZZZZ"
#         channel: "#alerts"
#   - email_configs:
#       - to: "you@example.com"
#         from: "alerts@example.com"
#         smarthost: "smtp.example.com:587"
#         auth_username: "user"
#         auth_identity: "user"
#         auth_password: "password"