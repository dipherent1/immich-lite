groups:
  - name: immich
    rules:
      - alert: WorkerDown
        expr: up{job="immich-worker"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Face embedding worker is down"
          description: "The Celery photo worker ({{ $labels.instance }}) has been unscrapable for 1m. New uploads are not being matched."

      - alert: QueueGrowingStalled
        expr: |
          rabbitmq_queue_messages_ready{queue="photos"} > 5 and changes(rabbitmq_queue_messages_ready{queue="photos"}[15m]) == 0
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Photo queue is backed up"
          description: "The photos queue has {{ $value }} jobs and has not drained in 5m. Worker may be stuck."

      - alert: Http5xxRate
        expr: |
          sum(rate(http_requests_total{status="5xx"}[5m])) by (job) > 0.05
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Elevated 5xx rate"
          description: "Job {{ $labels.job }} 5xx rate is {{ $value }} req/s over 5m."

      - alert: QdrantDown
        expr: up{job="qdrant"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Qdrant is down"
          description: "Qdrant vector store ({{ $labels.instance }}) has been unscrapable for 1m."

      - alert: PostgresDown
        expr: up{job="postgres"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Postgres exporter is down"
          description: "Postgres is not reachable for metrics."

      - alert: RabbitMQDown
        expr: up{job="rabbitmq"} == 0 or rabbitmq_up == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "RabbitMQ is unreachable"
          description: "The RabbitMQ broker or its exporter has been down for 1m (instance {{ $labels.instance }}). Jobs and live notifications are not flowing."