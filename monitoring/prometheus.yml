global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: "immich-app"
    static_configs:
      - targets: ["app:8000"]
    metrics_path: /metrics

  - job_name: "immich-worker"
    static_configs:
      - targets: ["worker:9100"]
    metrics_path: /metrics

  - job_name: "qdrant"
    static_configs:
      - targets: ["qdrant:6333"]
    metrics_path: /metrics

  - job_name: "rabbitmq"
    static_configs:
      - targets: ["rabbitmq-exporter:9419"]

  - job_name: "postgres"
    static_configs:
      - targets: ["postgres-exporter:9187"]