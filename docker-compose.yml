services:
  # --- Core persistence & message broker ---
  postgres:
    image: postgres:16-alpine
    container_name: immich-lite-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      POSTGRES_DB: ${POSTGRES_DB:-immich_lite}
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB:-immich_lite}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - app-network
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.0
    container_name: immich-qdrant
    ports:
      - "127.0.0.1:8190:6333"
    volumes:
      - qdrant_storage:/qdrant/storage
    networks:
      - app-network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: immich-lite-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:?RABBITMQ_DEFAULT_USER is required}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:?RABBITMQ_DEFAULT_PASS is required}
    volumes:
      - rabbitmq_storage:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - app-network
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: immich-lite-redis
    command: redis-server --save "" --appendonly no --maxmemory 64mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - app-network
    restart: unless-stopped

  # --- Application backend & worker ---
  app:
    image: ghcr.io/dipherent1/immich-lite-backend:${IMAGE_TAG:-dev}
    build: ./backend
    container_name: immich-lite-app
    volumes:
      - ./output:/app/output
      - immich_ml_cache:/root/.cache/immich_ml
    environment:
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-immich_lite}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET is required}
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/%2F
      - REDIS_URL=redis://redis:6379/0
      - MODEL_NAME=${MODEL_NAME:-buffalo_s}
      - OUTPUT_ROOT=${OUTPUT_ROOT:-/app/output}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000}
      - RATE_LIMIT_GLOBAL=${RATE_LIMIT_GLOBAL:-150/minute}
      - RATE_LIMIT_AUTH=${RATE_LIMIT_AUTH:-10/minute}
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  worker:
    image: ghcr.io/dipherent1/immich-lite-backend:${IMAGE_TAG:-dev}
    build: ./backend
    container_name: immich-lite-worker
    command: ["python", "-m", "app.workers.photo_worker"]
    volumes:
      - ./output:/app/output
      - immich_ml_cache:/root/.cache/immich_ml
    environment:
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql+psycopg2://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-immich_lite}
      - RABBITMQ_URL=amqp://${RABBITMQ_DEFAULT_USER}:${RABBITMQ_DEFAULT_PASS}@rabbitmq:5672/%2F
      - MODEL_NAME=${MODEL_NAME:-buffalo_s}
      - OUTPUT_ROOT=${OUTPUT_ROOT:-/app/output}
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-1}
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - app-network
    restart: unless-stopped

  # --- Application frontend ---
  frontend:
    image: ghcr.io/dipherent1/immich-lite-frontend:${IMAGE_TAG:-dev}
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
    container_name: immich-lite-frontend
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - INTERNAL_API_URL=http://app:8000
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - app
    networks:
      - app-network
    restart: unless-stopped

volumes:
  postgres_storage:
  qdrant_storage:
  rabbitmq_storage:
  immich_ml_cache:

networks:
  app-network:
    name: immich-lite-network
    driver: bridge
