services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: immich-qdrant
    ports:
      - "8090:6333"
      - "8100:6334"
    volumes:
      - qdrant_storage:/qdrant/storage
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: immich-lite-postgres
    environment:
      POSTGRES_USER: immich
      POSTGRES_PASSWORD: immich
      POSTGRES_DB: immich_lite
    ports:
      - "5433:5432"
    volumes:
      - postgres_storage:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U immich -d immich_lite"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: immich-lite-redis
    restart: unless-stopped

  rq-dashboard:
    image: eoranged/rq-dashboard
    container_name: immich-lite-rq-dashboard
    ports:
      - "9181:9181"
    environment:
      - RQ_DASHBOARD_REDIS_URL=redis://redis:6379/0
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  # --- Observed services / exporters ---
  redis-exporter:
    image: oliver006/redis_exporter:latest
    container_name: immich-lite-redis-exporter
    ports:
      - "9121:9121"
    command: ["-redis.addr", "redis://redis:6379/0"]
    depends_on:
      redis:
        condition: service_started
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: immich-lite-postgres-exporter
    ports:
      - "9187:9187"
    environment:
      - DATA_SOURCE_NAME=postgresql://immich:immich@postgres:5432/immich_lite?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # --- Core monitoring stack ---
  prometheus:
    image: prom/prometheus:latest
    container_name: immich-lite-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.retention.time=15d"
    depends_on:
      - app
      - worker
      - qdrant
      - redis
      - redis-exporter
      - postgres-exporter
    restart: unless-stopped

  alertmanager:
    image: prom/alertmanager:latest
    container_name: immich-lite-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
    depends_on:
      - prometheus
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    container_name: immich-lite-grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

  app:
    build: .
    container_name: immich-lite-app
    ports:
      - "8080:8000"
    volumes:
      - ./output:/app/output
      - ./config.yml:/app/config.yml
      - immich_ml_cache:/root/.cache/immich_ml
    environment:
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql+psycopg2://immich:immich@postgres:5432/immich_lite
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - REDIS_URL=redis://redis:6379/0
      - MODEL_NAME=buffalo_s
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

  worker:
    build: .
    container_name: immich-lite-worker
    command: ["python", "-m", "app.workers.photo_worker"]
    volumes:
      - ./output:/app/output
      - immich_ml_cache:/root/.cache/immich_ml
    environment:
      - QDRANT_URL=http://qdrant:6333
      - DATABASE_URL=postgresql+psycopg2://immich:immich@postgres:5432/immich_lite
      - REDIS_URL=redis://redis:6379/0
      - MODEL_NAME=buffalo_s
      - OUTPUT_ROOT=/app/output
    depends_on:
      qdrant:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    restart: unless-stopped

volumes:
  qdrant_storage:
  postgres_storage:
  immich_ml_cache:
  prometheus_data:
  grafana_data:
